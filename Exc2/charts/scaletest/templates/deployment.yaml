apiVersion: apps/v1
kind: Deployment
metadata:
 name: {{ .Release.Name }}-deployment
 labels:
   app: {{ .Chart.Name }}
spec:
 replicas: 1
 selector:
    matchLabels:
      app: {{ .Chart.Name }}
 template:
   metadata:
     labels:
       app: {{ .Chart.Name }}
   spec:
    containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: {{ .Values.container.port }}
        resources:
         requests:
           memory: "5Mi"
         limits:
           memory: "10Mi"
 