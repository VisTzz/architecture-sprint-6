apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  labels:
    app: {{ .Chart.Name }}
    prometheus-monitored: {{ .Chart.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: scaleble-service-port
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.container.port }}
      protocol: TCP
  selector:
    app: {{ .Chart.Name }}
